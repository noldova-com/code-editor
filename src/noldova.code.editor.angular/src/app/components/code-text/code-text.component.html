@for (line of lines(); track $index) {
  <span class="nol-code-text-line">@for (span of line.spans; track $index) {@if (classOf(span) === "") {{{ span.text }}} @else {<span [class]="classOf(span)">{{ span.text }}</span>}}</span>
}
